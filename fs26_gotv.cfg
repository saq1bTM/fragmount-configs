// for help DM @saq1btm on discord.

// general commands
sv_competitive_official_5v5 1           // allows xray/spectator wallhacks
mp_teamprediction_txt "HLTV Odds"       // sets the predictions panel to say HLTV Odds on load instead of every time you use setprediction because performance

// help/instructions
clear
alias gotv_help "gotv_help1;gotv_help2;gotv_help3;gotv_help4"
alias gotv_help1 "echo;echo Instructions:;echo;echo <n> = any number;echo;echo setteam<n>_<team prefix> - will set teamname of CT's or T's to one of the teams. (depending on team prefix and n);echo;echo TIP: use the command prefixes to print team prefixes"                                                    // done in a more performance intensive way
alias gotv_help2 "echo having <n> as 1 here will tell it to to change the name of team 1, the team starting ct, and for 2 it will change the name of team 2, the team starting t.;echo setscore<n>-<n> - will change values for the little thing that pops up for 5 seconds saying the match of 3 and score"        // as you can only put so many commands in an alias
alias gotv_help3 "echo setprediction_<n> - will briefly show a 5 second popup at the start of each round saying HLTV Odds and then a bar with a percentage, <n> defines the percentage, so if it is <n>=65 it will show a 65 percent chance of team 1 winning"                                                      // without csgo telling you to bug off
alias gotv_help4 "echo;echo e.g;echo;echo setteam1_3m2m;echo setteam2_pu;echo setscore0-0;echo setprediction_90;echo;echo use the command gotv_help to bring this up again;echo"                                                                                                                                    // because its too long
gotv_help                                                                                                                                                                                                                                                                                                           // and also i reduce file size this way with this approach (not the 4 part thing)

// list team prefixes command
alias prefixes "echo;echo 3m2m - 3M2M;echo pu - PUZ00;echo pk - Play3rK1llerz;echo bl - bl0ckerz;echo end - England Now Deliver;echo hz - hazard.net;echo lq - Team Liquidated;echo"


