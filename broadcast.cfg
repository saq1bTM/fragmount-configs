spec_show_xray 1
bind x "toggle spec_show_xray"
alias writepreload "host_writeconfig pretourney"

unaliaswritepreload	// thanks to this, which will only get defined later, after the first time the cfg loads the pretourney (user settings before loading the cfg) will not get written
writepreload




// Performance and Graphics
mat_monitorgamma 2.2               // Sets the Gamma (in-game brightness option) to 2, nice and bright, but not washed out.
mat_queue_mode 2                // Preloading. (?)
cl_forcepreload 1                // Preloading.
engine_no_focus_sleep 0


// Network Settings
rate 786432                        // Max Bandwidth is set to ~7Mbps. (?)
cl_updaterate 128                // Sets Download Rate to 128 times per second. (?)
cl_cmdrate 128                        // Sets Upload Rate to 128 times per second. (?)
cl_interpolate 1		// Idk man it just does something interpolation related.	
cl_interp 0                        // Lowers interpolation
cl_interp_ratio 1                // Interpolation Ratio. (?)
cl_predict 1                        // Prediction.
cl_lagcompensation 1                // Lag Compensation.
cl_obs_interp_enable 0		    // NO clue probably interpolation.


// Audio Settings
windows_speaker_config 1        // Sets CS:GO's Audio Mode to "Headphones".
snd_mixahead 0.07                  // Sets the Audio Buffer to 70ms.
dsp_slow_cpu 0                         // High-Quality Sound.
dsp_enhance_stereo 0                 // Disable Additional Stereo Processing. (?)
snd_legacy_surround 0                 // Before the release of HRTF, I am not aware of any actual change made by this so i have left it here just cause
snd_pitchquality 1                // Pitch Accuracy. (???)                    
snd_deathcamera_volume 0        // Self-Explanatory for all of the below until:
snd_mapobjective_volume 0
snd_menumusic_volume 0       //
snd_musicvolume 0.5             //
snd_mute_losefocus 0
snd_roundend_volume 0
snd_roundstart_volume 0
snd_tensecondwarning_volume 0
volume 1                        //
voice_scale 1                     
snd_mute_losefocus 0


// Crosshair Settings
cl_crosshairalpha 255                // 
cl_crosshaircolor 5                //
cl_crosshaircolor_b 50        //
cl_crosshaircolor_r 50        //
cl_crosshaircolor_g 255        //
cl_crosshairdot 0                        // Turns off the Crosshair Dot.
cl_crosshairgap -1
cl_crosshairsize 5                //
cl_crosshairstyle 4                //
cl_crosshairusealpha 1        //
cl_crosshairthickness 1                // Sets Crosshair Thickness to 1.
cl_fixedcrosshairgap -1                // Sets Crosshair Gap to -1.
cl_crosshair_outlinethickness 1
cl_crosshair_drawoutline 1




// Viewmodel Settings
viewmodel_offset_y 2
viewmodel_offset_x 2
viewmodel_offset_z -2
viewmodel_fov 68
cl_viewmodel_shift_left_amt 0
cl_viewmodel_shift_right_amt 0
cl_bob_lower_amt 0
cl_bobamt_lat 0
cl_bobamt_vert 0




// HUD Settings. No Explanation as I'm having a diabolical headache and this is almost 4,000 characters.
cl_hud_color 0
cl_hud_playercount_showcount 0
cl_hud_healthammo_style 1
cl_hud_background_alpha 0.5
cl_hud_bomb_under_radar 0
hud_scaling 0.85
cl_showfps 0
cl_hud_playercount_pos 0
net_graph 0
cl_hud_radar_scale 1
cl_radar_always_centered 0
cl_radar_rotate 1
cl_radar_icon_scale_min 0.6
cl_spec_stats 0
cl_spec_show_bindings 0
spec_hide_players 0
cl_show_clan_in_death_notice 1
cl_disablefreezecam 1
cl_freezecampanel_position_dynamic 0
cl_chatfilters 1


// Finish Up.
alias unaliaswritepreload "alias writepreload """
play buttons\blip1
clear
echo "the cfg loaded, please pause and unpause your game to refresh the hud and finish"
